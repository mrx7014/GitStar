<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">GitStar — Your starred repos, with a point of view.</title>
  <desc id="desc">A monochrome project banner showing a focused collection of starred repositories.</desc>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191919"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1600" height="500" fill="url(#fade)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <path d="M0 414H1600" stroke="#ffffff" stroke-opacity=".14"/>
  <g fill="none" stroke="#ffffff" stroke-opacity=".22" stroke-width="2">
