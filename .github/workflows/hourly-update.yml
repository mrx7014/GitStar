name: GitStar automatic site update

on:
  schedule:
    # GitHub Actions evaluates scheduled workflows in UTC; check for updates every ten minutes.
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gitstar-publish
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  update:
    name: Sync, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo 'GitHub Pages is not ready. Open Settings → Pages and set Source to GitHub Actions.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync starred repositories
        run: node scripts/sync-stars.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITSTAR_USERNAME: ${{ vars.GITSTAR_USERNAME }}
          GITHUB_STEP_SUMMARY: ${{ github.step_summary }}

      - name: Show sync status
        run: |
          status=$(node -e "console.log(JSON.parse(require('fs').readFileSync('public/data/status.json')).status)")
          echo "Sync status: $status"
          if [ "$status" != ok ]; then
            echo '::warning::Sync was not fully successful; the previous repository snapshot will remain online.'
          fi

      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Commit updated data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m "chore(data): scheduled stars update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy updated site
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
