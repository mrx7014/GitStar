name: Sync GitHub Stars
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch:
permissions: { contents: write, actions: write }
concurrency: { group: gitstar-sync, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/sync-stars.mjs
        env: { GITHUB_TOKEN: ${{ github.token }}, GITHUB_USERNAME: ${{ vars.GITHUB_USERNAME || '' }} }
      - name: Warn on status
        run: |
          status=$(node -e "console.log(require('./public/data/status.json').status)")
          [ "$status" = ok ] || echo "::warning::GitStar sync status is $status"
      - name: Commit changed data
        id: commit
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/
          if git diff --cached --quiet; then echo changed=false >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "chore(data): sync stars"; git pull --rebase origin main; git push; echo changed=true >> "$GITHUB_OUTPUT"
      - name: Keep scheduled workflows alive
        if: github.event_name == 'schedule' && vars.GITSTAR_KEEPALIVE != 'false'
        run: |
          [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 3888000 ] && git commit --allow-empty -m 'chore: keep scheduled workflows alive' && git push || true
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: await github.rest.actions.createWorkflowDispatch({owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'deploy-pages.yml', ref: 'main'})
