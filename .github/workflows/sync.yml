name: Sync GitHub Stars

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gitstar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Sync starred repositories
        run: node scripts/sync-stars.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITSTAR_USERNAME: ${{ vars.GITSTAR_USERNAME }}
      - name: Warn on sync status
        run: |
          status=$(node -e "console.log(require('./public/data/status.json').status)")
          if [ "$status" != "ok" ]; then
            echo "::warning::GitStar sync status is $status"
          fi
      - name: Commit changed data
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore(data): sync stars"
          git pull --rebase origin main
          git push
